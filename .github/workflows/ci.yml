name: CI

on:
  push:
    branches: [main, features/**, feat/**, fix/**, hotfix/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default.
permissions:
  contents: read

jobs:
  # Lint + typecheck + tests + production build in a single job: one checkout,
  # one npm ci, one required check. Fails fast in quality order.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      ENCRYPTION_KEY: ci-only-encryption-key-32-bytes!
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Secrets scan, dependency audit and OWASP static analysis in one job.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action lists PR commits via the GitHub API on pull_request events.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || echo "::warning::npm audit found high vulnerabilities — review required"
      - name: Semgrep (OWASP top ten)
        # Informative for now; flip continue-on-error to false once the baseline is clean.
        continue-on-error: true
        run: |
          pipx install semgrep
          semgrep scan --config p/owasp-top-ten --config p/secrets --error --exclude node_modules
