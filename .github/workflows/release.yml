name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # main is protected by the required CI checks (quality, security),
    # so anything landing here has already passed CI.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Let semantic-release authenticate the remote (GITHUB_TOKEN) so
          # @semantic-release/git can push CHANGELOG.md + version bump.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: semantic-release (tag + GitHub Release + CHANGELOG)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT if branch protection blocks the changelog push by GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
